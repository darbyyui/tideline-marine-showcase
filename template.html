    while(true){const {value,done}=await reader.read();if(done)break;chunks.push(value);size+=value.byteLength;onProgress(size);}
   }else{const value=new Uint8Array(await response.arrayBuffer());chunks.push(value);size=value.byteLength;onProgress(size);}
   const bytes=new Uint8Array(size);let offset=0;
   for(const chunk of chunks){bytes.set(chunk,offset);offset+=chunk.byteLength;}
   return bytes;
  }catch(error){
   lastError=error;
   if(signal?.aborted)throw error;
   if(error.retryable===false||attempt===2)throw error;
   await new Promise(resolve=>setTimeout(resolve,250*2**attempt));
  }
 }

}
