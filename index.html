<style>
*{box-sizing:border-box}
body{--compass-size:118px;--guide-lift:27px;--ellipse:.593;--edge:clamp(12px,3vw,42px);--hud-drop:calc((var(--edge) + 47px) * .4);margin:0;overflow:hidden;background:#0a2029;color:#f4f8f9;font:14px system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#stage{position:fixed;inset:0;background:linear-gradient(#163242,#95b7be 48%,#174752 49%,#071f29)}
#boat-switch{position:absolute;top:var(--edge);right:var(--edge);padding:8px 0;border:0;border-radius:0;background:transparent;z-index:3;font-size:12px}
#boat-switch:hover{background:transparent}
header{position:absolute;top:0;left:0;padding:clamp(20px,4vw,64px);pointer-events:none;}
h1{font-size:clamp(34px,6vw,76px);font-weight:550;letter-spacing:.10em;margin:6px 0 3px}
.eyebrow{letter-spacing:.29em;font-size:11px;font-weight:700;color:#fff}
.sub{color:#e2f2f4;margin:0}
button{background:transparent;color:#fff;border:1px solid transparent;border-radius:8px;cursor:pointer;font:inherit;opacity:.57;}
button[aria-pressed=true],button[aria-expanded=false]{border-color:#fff;opacity:1}
button:hover{background:#c8eff13d;opacity:1}
button:focus-visible,input:focus-visible,.compass:focus-visible{outline:2px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
.toolbar{--view-button-height:36px;position:absolute;bottom:calc(var(--edge) + 19px - var(--hud-drop));right:var(--edge);width:min(570px,calc(100% - 2 * var(--edge) - 142px));text-align:right;display:grid;grid-template-columns:29px minmax(0,1fr);gap:8px;align-items:center;padding:9px;border:1px solid transparent;border-radius:14px;overflow:hidden}
.toolbar.is-closed{width:42px;height:42px;padding:0;border-radius:50%;display:grid;grid-template-columns:1fr;gap:0;place-items:center}
.toolbar.is-closed .panel-arrow{align-self:center;width:32px;height:32px;margin:0;border-radius:50%}
.panel-arrow{display:grid;place-items:center;width:30px;height:26px;padding:0}
.panel-arrow svg{display:block;transform:rotate(0deg);transition:transform 300ms cubic-bezier(.22,.70,.22,1);width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.panel-arrow[aria-expanded=false] svg{transform:rotate(180deg)}
@media(prefers-reduced-motion:reduce){.panel-arrow svg{transition:none}}
.toolbar .panel-arrow{width:29px;align-self:start;margin-top:calc(11px * 1.45 + 15px + (var(--view-button-height) + 12px - 26px) / 2)}
.button-row{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.button-row.secondary{grid-template-columns:repeat(5,minmax(0,1fr)) 26px 26px;gap:5px;align-items:center;padding-left:26px}
.secondary > button{width:100%;border-color:transparent;background:transparent}
.secondary > button:hover{background:#c8eff13d}
.secondary .icon-action{display:grid;place-items:center}
#cruise{display:flex;align-items:center;justify-content:center;gap:7px}
#cruise-label{display:inline-block}
#cruise svg{flex:0 0 16px;width:16px;height:16px;fill:currentColor}

 wasHeadingDragging=compassDragging;
 seaUniforms.tailVisibility.value=compassDragging?0:Math.min(1,seaUniforms.tailVisibility.value+dt/.35);

 advanceIntro(now,dt);
 const effectsTarget=introComplete||introStart!==null?1:0;

 const lightReveal=floor.material.uniforms.lightReveal;

 heading.rotation.y=-Number($('heading').value)*Math.PI/180;

 if(introComplete){
  speedElapsed=Math.min(speedElapsed+dt,speedDuration);
  const progress=T.MathUtils.smoothstep(speedElapsed,0,speedDuration);
  speed=T.MathUtils.lerp(startSpeed,cruising?cruiseSpeed:0,progress);

  propellerAngle=(propellerAngle+dt*(speed/cruiseSpeed)*480)%360;

 }
 seaUniforms.course.value.set(sin,cos);
 if(following&&!reduced.matches)vesselPosition.addScaledVector(direction.set(sin,cos),speed*dt);
 seaUniforms.packetCount.value=updateWavePackets(time,reduced.matches?0:dt,nextWaveLevel,sin,cos,speed);
 const bowProbe=seaUniforms.hull.value.y;
 const incomingFlow=(incomingHeight(sin*(bowProbe-.5),cos*(bowProbe-.5))-incomingHeight(sin*(bowProbe+.5),cos*(bowProbe+.5)))*3.2;
 const fieldStep=mobileDevice&&!highQuality?1/20:1/30;
 if(time-lastField>=fieldStep){
   swell.update(time);chopField.update(time);
   const boatContact=introComplete||introStart!==null?seaUniforms.waterContact.value:0;
   updateWake(time,speed*boatContact,sin,cos,seaUniforms.hull.value,seaUniforms.draft.value,incomingFlow,boatContact);
   lastField=time;
 }
 const frameTime=time-fieldStep*1.75;
 const longFrame=swell.frames(frameTime),shortFrame=chopField.frames(frameTime);
 const priorWake=frameTime<wakeEarlier.time?wakeOldest:wakeEarlier;
 const nextWake=frameTime<wakeEarlier.time?wakeEarlier:wakeField;

 seaUniforms.earlierSwell.value=longFrame.a.texture;seaUniforms.swellTex.value=longFrame.b.texture;
 seaUniforms.earlierChop.value=shortFrame.a.texture;seaUniforms.chopTex.value=shortFrame.b.texture;
 seaUniforms.earlierWake.value=priorWake.texture;seaUniforms.wakeTex.value=nextWake.texture;
 seaUniforms.frameBlend.value.set(longFrame.mix,shortFrame.mix,wakeMix);
 seaUniforms.wakeOffset.value.copy(vesselPosition).sub(nextWake.origin);
 seaUniforms.earlierWakeOffset.value.copy(vesselPosition).sub(priorWake.origin);
 const sample=(x,z)=>{
   const front=incomingHeight(x,z);
   x+=vesselPosition.x;z+=vesselPosition.y;
   return (swell.sample(x,z)+chopField.sample(x*.943+z*.333,z*.943-x*.333)+.10*Math.sin(.28*x-.22*z-.68*time))*.45+front;
 };
 const fore=seaUniforms.hull.value.y*.62;
 const bow=sample(sin*fore,cos*fore),stern=sample(-sin*fore,-cos*fore);
 const beam=seaUniforms.hull.value.x*.75;
 const starboard=sample(cos*beam,-sin*beam),port=sample(-cos*beam,sin*beam);
 // Four buoyancy stations approximate displacement from local immersion.
 // Normalizing the station areas makes their total static lift equal the vessel weight.
 const beamScale=seaUniforms.hull.value.x/2;
 const mass=4.8*Math.max(.35,beamScale), gravity=9.81;
 trimHeight=T.MathUtils.lerp(trimHeight,-seaUniforms.draft.value,1-Math.exp(-dt*8));
 if(Math.abs(trimHeight+seaUniforms.draft.value)<.0002)trimHeight=-seaUniforms.draft.value;
 const baseKeel=trimHeight-keelDepth;
 const wetDepth=Math.max(bow,stern,starboard,port,sample(0,0))-baseKeel;
 const coupling=T.MathUtils.smoothstep(wetDepth,0,Math.max(.24,keelDepth*.85));
 seaUniforms.waterContact.value=coupling;
 const neutral=.45,keel=heave.value-neutral;

 float.position.y=trimHeight+liftResponse*coupling;
 float.rotation.set(p*cos+r*sin,0,r*cos-p*sin);
 seaUniforms.pose.value.set(float.position.y,-p,r);
 updateCabinProjection();
 updatePropellerThrust(dt,sin,cos,sample);
 if(!reduced.matches)updateSpray(dt,speed*coupling,sin,cos,sample,seaUniforms.hull.value.y*.87);
 if(transition){
   const u=reduced.matches?1:Math.min(1,(now-transition.time)/(transition.duration||720));
   const k=u*u*(3-2*u);
   if(transition.water){
    camera.position.lerpVectors(transition.start,transition.end,k);
    orbit.target.lerpVectors(transition.startTarget,transition.endTarget,k);
   }else{
    const a=new T.Spherical().setFromVector3(transition.start),b=new T.Spherical().setFromVector3(transition.end);
    const angle=Math.atan2(Math.sin(b.theta-a.theta),Math.cos(b.theta-a.theta));
    camera.position.setFromSpherical(new T.Spherical(T.MathUtils.lerp(a.radius,b.radius,k),T.MathUtils.lerp(a.phi,b.phi,k),a.theta+angle*k)).add(target);
   }
   if(u===1){
    orbit.maxPolarAngle=submerged?2.25:1.53;
    if(transition.spinAfter)orbit.autoRotate=true;
    transition=null;
   }
 }
 animateLuxury(now,dt,sample);
 compassFrozen=boatLoading||Boolean(departingBoat);
 compass.setAttribute('aria-disabled',String(compassFrozen));
 if(sail && !reduced.matches)sail(time);
 updateBirds(time);
 updateDaylight(dt,reduced.matches);
 orbit.update(dt);

 updateNavLights(now,reduced.matches);
 updateBearingRing(dt,reduced.matches,sample);
 const waterline=sample(camera.position.x-introOffset.x,camera.position.z-introOffset.y);
 const below=1-T.MathUtils.smoothstep(camera.position.y-waterline,-.45,.22);
 seaUniforms.submerged.value=below;sky.material.uniforms.under.value=below;
 underwaterFill.intensity=below*skyMode.z*1.55;
 adjustRenderQuality(now);
 const pitch=Math.PI/2-orbit.getPolarAngle();
 const ellipse=.593+.407*T.MathUtils.smoothstep(pitch,Math.PI/4,Math.PI*75/180);
 const ellipseValue=ellipse.toFixed(3);
 if(document.body.style.getPropertyValue('--ellipse')!==ellipseValue)document.body.style.setProperty('--ellipse',ellipseValue);
 ocean.position.set(camera.position.x*.29,0,camera.position.z*.29);
 renderer.render(scene,camera);
});
