<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>潮境 · 3D 船艇展示</title>
<style>
*{box-sizing:border-box}
body{--compass-size:118px;--guide-lift:27px;--ellipse:.593;--edge:clamp(12px,3vw,42px);--hud-drop:calc((var(--edge) + 47px) * .4);margin:0;overflow:hidden;background:#0a2029;color:#f4f8f9;font:14px system-ui,sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#stage{position:fixed;inset:0;background:linear-gradient(#163242,#95b7be 48%,#174752 49%,#071f29)}
#boat-switch{position:absolute;top:var(--edge);right:var(--edge);padding:8px 0;border:0;border-radius:0;background:transparent;z-index:3;font-size:12px}
#boat-switch:hover{background:transparent}
header{position:absolute;top:0;left:0;padding:clamp(20px,4vw,64px);pointer-events:none;}
h1{font-size:clamp(34px,6vw,76px);font-weight:550;letter-spacing:.10em;margin:6px 0 3px}
.eyebrow{letter-spacing:.29em;font-size:11px;font-weight:700;color:#fff}
.sub{color:#e2f2f4;margin:0}
button{background:transparent;color:#fff;border:1px solid transparent;border-radius:8px;cursor:pointer;font:inherit;opacity:.57;}
button[aria-pressed=true],button[aria-expanded=false]{border-color:#fff;opacity:1}
button:hover{background:#c8eff13d;opacity:1}
button:focus-visible,input:focus-visible,.compass:focus-visible{outline:2px solid #fff;outline-offset:2px}
[hidden]{display:none!important}
.toolbar{--view-button-height:36px;position:absolute;bottom:calc(var(--edge) + 19px - var(--hud-drop));right:var(--edge);width:min(570px,calc(100% - 2 * var(--edge) - 142px));text-align:right;display:grid;grid-template-columns:29px minmax(0,1fr);gap:8px;align-items:center;padding:9px;border:1px solid transparent;border-radius:14px;overflow:hidden}
.toolbar.is-closed{width:42px;height:42px;padding:0;border-radius:50%;display:grid;grid-template-columns:1fr;gap:0;place-items:center}
.toolbar.is-closed .panel-arrow{align-self:center;width:32px;height:32px;margin:0;border-radius:50%}
.panel-arrow{display:grid;place-items:center;width:30px;height:26px;padding:0}
.panel-arrow svg{display:block;transform:rotate(0deg);transition:transform 300ms cubic-bezier(.22,.70,.22,1);width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.panel-arrow[aria-expanded=false] svg{transform:rotate(180deg)}
@media(prefers-reduced-motion:reduce){.panel-arrow svg{transition:none}}
.toolbar .panel-arrow{width:29px;align-self:start;margin-top:calc(11px * 1.45 + 15px + (var(--view-button-height) + 12px - 26px) / 2)}
.button-row{position:relative;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:5px}
.button-row.secondary{grid-template-columns:repeat(5,minmax(0,1fr)) 26px 26px;gap:5px;align-items:center;padding-left:26px}
.secondary > button{width:100%;border-color:transparent;background:transparent}
.secondary > button:hover{background:#c8eff13d}
.secondary .icon-action{display:grid;place-items:center}
#cruise{display:flex;align-items:center;justify-content:center;gap:7px}
#cruise-label{display:inline-block}
#cruise svg{flex:0 0 16px;width:16px;height:16px;fill:currentColor}
#propeller{transform-origin:12px 12px}
.secondary > .quality-bar{width:min(100%,54px);justify-self:center;display:grid;align-content:center;gap:3px;min-width:0;opacity:1!important}
.quality-bar .quality-scale{display:flex;justify-content:space-between;font-size:9px;font-weight:650}
.quality-scale span:first-child{color:#ffd664}.quality-scale span:last-child{color:#80eab0}
.secondary #daylight{white-space:nowrap}
.quality-track{height:4px;width:100%;background:#d2eef54d;border-radius:999px;overflow:hidden}
.quality-track::before{content:"";display:block;width:100%;height:100%;border-radius:inherit;background:#80eab0;transform-origin:left;transition:transform .23s ease,background-color .23s ease}
.secondary > .quality-bar:hover{background:transparent}
.quality-bar[data-level="LD"] .quality-track::before{transform:scaleX(.36);background:#ffd664}
@media(prefers-reduced-motion:reduce){.quality-track::before{transition:none}}
.icon-action svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.button-pair{position:relative;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:5px}
.selection-outline{position:absolute;left:0;top:0;bottom:0;width:0;opacity:0;pointer-events:none;border:1px solid #fff;border-radius:8px;transition:transform .25s ease,width .25s ease,opacity .16s ease}
[data-choice] button[aria-pressed=true]{border-color:transparent}
@media(prefers-reduced-motion:reduce){.selection-outline{transition:none}}
.button-row + .button-row{margin-top:13px}
.button-row[data-choice]{padding:5px;border:1px solid #ffffff72;border-radius:999px}
.button-row[data-choice] .selection-outline{top:5px;bottom:5px}
.button-row button,.selection-outline{border-radius:999px}
.button-row button{height:var(--view-button-height);padding:4px 2px;font-size:12px;line-height:1.15}
output{position:absolute;right:var(--edge);bottom:3px;display:block;text-align:right;max-width:calc(100% - 2 * var(--edge));color:#fff;opacity:.69;font-size:10px;overflow-wrap:anywhere;}
.lever-panel{overflow:hidden;position:absolute;top:50%;transform:translateY(-50%);width:54px;text-align:center}
.lever-panel.left{left:var(--edge)}.lever-panel.right{right:var(--edge)}
.lever{display:grid;justify-items:center;gap:5px;padding:6px 4px;border-radius:999px}
.lever-track{display:grid;place-items:center;width:40px;padding:13px 0}
.lever label{color:#fff;font-size:11px;white-space:nowrap;}
.lever button{width:29px;height:29px;padding:0;border-radius:50%;font-size:17px;line-height:1}
.lever button:active{border-color:#fff;opacity:1}
.lever-track.zero-marked{position:relative}
.zero-marked::before,.zero-marked::after{content:"-";position:absolute;top:50%;transform:translateY(-50%);color:#fff9;font-size:13px;pointer-events:none}
.zero-marked::before{left:0}.zero-marked::after{right:0}
.lever input[type=range]{writing-mode:vertical-lr;direction:rtl;appearance:none;background:transparent;width:27px;height:clamp(58px,15vh,120px);margin:0;accent-color:#f2ffff}
.lever input[type=range]::-webkit-slider-runnable-track{width:2px;height:100%;background:#ffffff80;border-radius:999px}
.lever input[type=range]::-webkit-slider-thumb{appearance:none;width:15px;height:15px;margin-left:-6.5px;background:#fff;border:0;border-radius:50%;box-shadow:0 1px 4px #071b2460}
.lever input[type=range]::-moz-range-track{width:2px;height:100%;background:#ffffff80;border-radius:999px}
.lever input[type=range]::-moz-range-thumb{width:15px;height:15px;background:#fff;border:0;border-radius:50%;box-shadow:0 1px 4px #071b2460}
.lever input[type=number]{font:inherit;font-size:11px;text-align:center;width:43px;color:#fff;background:transparent;border:1px solid #ffffff68;border-radius:999px;padding:4px 2px;appearance:textfield;}
.lever input::-webkit-inner-spin-button,.lever input::-webkit-outer-spin-button{appearance:none;margin:0}
.compass{--angle:0deg;position:absolute;left:var(--edge);bottom:calc(var(--edge) + var(--guide-lift) + 21px + var(--compass-size) / 2 - var(--hud-drop));transform:translateY(50%);width:var(--compass-size);height:calc(var(--compass-size) * var(--ellipse));border-radius:50%;border:1px solid #a9dbe578;background:linear-gradient(#163643b8,#071b24c7);color:#c4dfe7;touch-action:none;cursor:grab;user-select:none;box-shadow:inset 0 -4px #031219a0,0 8px 22px #03131966}
.compass:active{cursor:grabbing}
.compass span{position:absolute;font-size:10px;font-weight:700;line-height:1;pointer-events:none}
.compass .north,.compass .south{left:50%;transform:translateX(-50%)}
.compass .north{top:4px;color:#fff}.compass .south{bottom:4px}
.compass .east,.compass .west{top:50%;transform:translateY(-50%)}
.compass .east{right:8px}.compass .west{left:8px}
.compass .needle{position:absolute;left:50%;top:50%;width:78px;height:78px;margin:-39px;transform:scaleY(var(--ellipse)) rotate(var(--angle));pointer-events:none}
.needle::before,.needle::after{content:'';position:absolute;left:50%;transform:translateX(-50%);width:13px;height:24px}
.needle::before{top:1px;clip-path:polygon(50% 0,100% 100%,0 100%);background:linear-gradient(90deg,#71b6c8 50%,#dbfaff 50%)}
.needle::after{bottom:1px;clip-path:polygon(0 0,100% 0,50% 100%);background:linear-gradient(90deg,#567d88 50%,#2b4d5b 50%)}
.compass .bearing{left:50%;top:50%;transform:translate(-50%,-50%);color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 1px 3px #061a23}
.view-guide,.guide{text-align:center;color:#e2f2f4;font:11px/1.45 system-ui,sans-serif;pointer-events:none}
.view-guide{margin:0 0 15px}
.guide{position:absolute;left:calc(var(--edge) + var(--compass-size) / 2);bottom:calc(var(--edge) + var(--guide-lift) - var(--hud-drop));transform:translate(-50%,50%);white-space:nowrap}
@media(max-width:740px){
 body{--compass-size:96px;--guide-lift:132px}header{padding:17px}
 .toolbar{--view-button-height:37px;width:calc(100% - 2 * var(--edge))}
 .button-row.secondary{padding-left:14px;grid-template-columns:repeat(5,minmax(0,1fr)) 22px 22px;gap:3px}
 .compass .needle{width:66px;height:66px;margin:-33px}
 .lever-panel{width:48px}
 .lever{padding:9px 3px 7px;gap:4px}
 .lever button{width:25px;height:25px}.lever input[type=number]{width:38px}
 .button-row button{font-size:11px}
 .secondary #daylight{white-space:normal}

 .icon-action svg{width:14px;height:14px}
}
@media(max-height:480px){
 .lever input[type=range]{height:48px}
}

.intro-white{position:fixed;inset:0;z-index:10;background:#fff;display:grid;place-items:center;pointer-events:none;opacity:1;transition:opacity 1.575s ease}
body.sea-revealed .intro-white{opacity:0}
.intro-credit{text-align:center;color:#737373;padding:20px}
.intro-credit img{display:block;width:clamp(165px,28vw,300px);height:auto;margin:0 auto;filter:brightness(0) invert(.45)}
.intro-credit p{margin:12px 0 0;font-size:7pt;letter-spacing:.075em}
.intro-loading{width:min(220px,64vw);margin:26px auto 0;font-size:11px;color:#737373}
.intro-loading-track{height:3px;border-radius:999px;background:#e9e9e9;overflow:hidden}
#loading-fill{display:block;width:100%;height:100%;background:#858585;transform:scaleX(0);transform-origin:left;transition:transform .18s ease}
.intro-loading-caption{display:flex;justify-content:space-between;gap:8px;margin-top:7px;font-variant-numeric:tabular-nums}
@media(prefers-reduced-motion:reduce){#loading-fill{transition:none}}
body.intro-active header{z-index:11;opacity:0;transition:opacity 1.575s ease}
body.intro-active.sea-revealed header{opacity:1}
body.intro-active :is(.toolbar,.lever-panel,.compass,.guide,output,#boat-switch){visibility:hidden;opacity:0}
body.intro-complete :is(.toolbar,.lever-panel,.compass,.guide,#boat-switch){animation:intro-interface .8s ease both}
@keyframes intro-interface{from{opacity:0}to{opacity:1}}
@media(prefers-reduced-motion:reduce){
 .intro-white,body.intro-active header{transition:none}
 body.intro-complete :is(.toolbar,.lever-panel,.compass,.guide){animation:none}
}
</style>
<body class="intro-active">
<div id="stage"></div>
<div class="intro-white" id="intro-white"><div class="intro-credit"><img src="./polish-logo.png" alt="Polish™"><p>由磨人創意網路有限公司的 D. 製作</p>
 <div class="intro-loading">
  <div class="intro-loading-track" id="loading-track" role="progressbar" aria-label="展示載入進度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span id="loading-fill"></span></div>
  <div class="intro-loading-caption" aria-hidden="true"><span id="loading-phase">準備展示</span><span id="loading-percent">0%</span></div>
 </div>
</div></div>
<header><div class="eyebrow">Power by Polish™</div><h1>潮境</h1><p class="sub">船艇與海面・即時 3D 展示</p></header>
<div class="guide">拖曳指針改變航向</div>
<section class="toolbar" aria-label="展示控制">
 <button class="panel-arrow" type="button" aria-expanded="true" aria-controls="toolbar-body" aria-label="收合展示控制" data-panel-name="展示控制"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15m-6-6 6 6-6 6"/></svg></button>
 <div id="toolbar-body">
 <p class="view-guide">拖曳旋轉、Shift＋拖曳平移、滾動或雙指縮放</p>
 <div class="button-row" role="group" aria-label="鏡頭視角" data-choice>
  <span class="selection-outline" aria-hidden="true"></span>
  <button data-view="bow" aria-pressed="true">船首</button><button data-view="side" aria-pressed="false">側舷</button><button data-view="stern" aria-pressed="false">船尾</button><button data-view="deck" aria-pressed="false">甲板俯視</button><button id="dive" aria-pressed="false">水下視角</button><button id="spin" aria-pressed="false">環繞</button>
 </div>
 <div class="button-row secondary" role="group" aria-label="船模、飛鳥、畫質與航行">
  <button id="quality-auto" class="quality-bar" data-level="LD" aria-pressed="false" aria-label="啟用自動畫質：LD">
   <span class="quality-scale" aria-hidden="true"><span>LD</span><span>HD</span></span>
   <span class="quality-track" aria-hidden="true"></span>
  </button>
  <button id="quality" aria-pressed="false">高畫質</button>
  <button id="daylight" title="切換天色">模式：白天</button>
  <button id="birds">趕走飛鳥</button>
  <button id="cruise"><span id="cruise-label">機關停止</span><svg viewBox="0 0 24 24" aria-hidden="true"><g id="propeller"><path id="propeller-blade" d="M11.5 11.3c-2-2.1-2.3-5-.8-6.6.8-.9 2.2-.5 2.6.6.7 1.7-.1 4.1-1 6Z"/><use href="#propeller-blade" transform="rotate(90 12 12)"/><use href="#propeller-blade" transform="rotate(180 12 12)"/><use href="#propeller-blade" transform="rotate(270 12 12)"/><circle cx="12" cy="12" r="1.4"/></g><circle cx="12" cy="12" r="10.7" fill="none" stroke="currentColor" stroke-width="1.15"/></svg></button>
   <button id="reset" class="icon-action" aria-label="恢復帆船" title="恢復帆船"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11a8 8 0 1 1 2 6M4 5v6h6"/></svg></button>
   <button id="load" class="icon-action" aria-label="載入船模" title="載入船模"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 14v5a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-5M12 16V4m-4 4 4-4 4 4"/></svg></button>
 </div>
 <input id="file" type="file" accept=".glb" hidden>
 </div>
</section>
<output id="status" aria-live="polite">正在初始化海面…</output>
<section class="lever-panel left" aria-label="迎面浪控制">
 <div id="wave-panel" class="lever">
  <label for="wave">迎面浪</label>
  <button type="button" data-adjust="wave" data-step="1" aria-label="增加迎面浪">+</button>
  <div class="lever-track"><input id="wave" type="range" min="0" max="100" value="50" aria-orientation="vertical"></div>
  <button type="button" data-adjust="wave" data-step="-1" aria-label="減少迎面浪">−</button>
  <input id="wave-value" type="number" min="0" max="100" step="1" value="50" inputmode="numeric" aria-label="迎面浪數值">
 </div>
</section>
<section class="lever-panel right" aria-label="吃水控制">
 <div id="trim-panel" class="lever">
  <label for="trim">吃水</label>
  <button type="button" data-adjust="trim" data-step="1" aria-label="增加吃水">+</button>
  <div class="lever-track zero-marked"><input id="trim" type="range" min="-1.6" max="1.6" step=".02" value="0" aria-orientation="vertical"></div>
  <button type="button" data-adjust="trim" data-step="-1" aria-label="減少吃水">−</button>
  <input id="trim-value" type="number" min="-1.6" max="1.6" step=".02" value="0" inputmode="decimal" aria-label="吃水數值">
 </div>
</section>

<div id="compass" class="compass" role="slider" tabindex="0" aria-label="船首方向" aria-valuemin="0" aria-valuemax="359" aria-valuenow="0" aria-valuetext="0 度">
 <span class="north" aria-hidden="true">N</span><span class="east" aria-hidden="true">E</span><span class="south" aria-hidden="true">S</span><span class="west" aria-hidden="true">W</span>
 <span class="needle" aria-hidden="true"></span><span id="bearing" class="bearing" aria-hidden="true">000°</span>
</div>
<script type="importmap">{"imports": {"three": "./three.module.js", "orbit": "./OrbitControls.js", "gltf": "./GLTFLoader.js", "geometry": "./BufferGeometryUtils.js", "reflector": "./Reflector.js"}}</script>


<script type="module">
import * as T from 'three';
import {OrbitControls} from 'orbit';
import {GLTFLoader} from 'gltf';
import {Reflector} from 'reflector';
const $ = id => document.getElementById(id);
const sideLevers=[...document.querySelectorAll('.lever-panel')];
const sideMotions=new WeakMap();
function showSideLevers(show,reduceMotion){
 for(const lever of sideLevers){
  const opacity=getComputedStyle(lever).opacity;
  sideMotions.get(lever)?.cancel();
  lever.inert=!show;
  if(reduceMotion){lever.hidden=!show;continue;}
  if(show){
   lever.hidden=false;
   const offset=(lever.classList.contains('left')?-1:1)*(lever.offsetWidth+48);
   sideMotions.set(lever,lever.animate(
    [{translate:offset+'px 0',opacity:0},{translate:'0px 0',opacity:1}],
    {duration:420,easing:'cubic-bezier(.22,.70,.22,1)'}
   ));
  }else if(!lever.hidden){
   const fade=lever.animate([{opacity},{opacity:0}],{duration:240,easing:'ease-out',fill:'forwards'});
   sideMotions.set(lever,fade);
   fade.onfinish=()=>{
    if(sideMotions.get(lever)!==fade)return;
    lever.hidden=true;fade.cancel();sideMotions.delete(lever);
   };
  }
 }
}
for(const button of document.querySelectorAll('[data-panel-name]')){
 const panel=button.parentElement,body=$(button.getAttribute('aria-controls'));
 let morph;
 button.onclick=()=>{
  const before=panel.getBoundingClientRect();
  const radius=getComputedStyle(panel).borderRadius;
  morph?.cancel();
  body.hidden=!body.hidden;
  const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
  showSideLevers(!body.hidden,reduceMotion);
  panel.classList.toggle('is-closed',body.hidden);
  button.setAttribute('aria-expanded',!body.hidden);
  button.setAttribute('aria-label',(body.hidden?'展開':'收合')+button.dataset.panelName);
  if(reduceMotion)return;
  const after=panel.getBoundingClientRect();
  morph=panel.animate([
   {width:before.width+'px',height:before.height+'px',borderRadius:radius},
   {width:after.width+'px',height:after.height+'px',borderRadius:getComputedStyle(panel).borderRadius}
  ],{duration:300,easing:'cubic-bezier(.22,.70,.22,1)'});
  if(!body.hidden)body.animate([{opacity:0},{opacity:1}],{duration:220,delay:55,fill:'backwards'});
 };
}
for(const group of document.querySelectorAll('[data-choice]')){
 const outline=group.querySelector('.selection-outline');
 function moveOutline(){
  const active=group.querySelector('button[aria-pressed="true"]');
  if(active&&active.offsetWidth){
   outline.style.width=active.offsetWidth+'px';
   outline.style.transform='translateX('+active.offsetLeft+'px)';
   outline.style.opacity='1';
  }else outline.style.opacity='0';
 }
 new MutationObserver(moveOutline).observe(group,{subtree:true,attributes:true,attributeFilter:['aria-pressed']});
 new ResizeObserver(moveOutline).observe(group);
 moveOutline();
}
function setLever(id,value){
 const slider=$(id);
 slider.value=String(value);
 $(id+'-value').value=slider.value;
}
for(const id of ['wave','trim']){
 const slider=$(id),number=$(id+'-value');
 slider.addEventListener('input',()=>{number.value=slider.value;});
 number.addEventListener('input',()=>{
  if(number.value!=='' && number.validity.valid)slider.value=number.value;
 });
 number.addEventListener('change',()=>setLever(id,Number.isFinite(number.valueAsNumber)?number.valueAsNumber:slider.value));
 number.addEventListener('keydown',e=>{if(e.key==='Enter')number.blur();});
}
for(const button of document.querySelectorAll('[data-adjust]')){
 button.onclick=()=>{
  const slider=$(button.dataset.adjust);
  setLever(slider.id,Number(slider.value)+Number(slider.step||1)*Number(button.dataset.step));
 };
}
const compass=$('compass');
let headingRevision=0;
function setHeading(angle){
 const bearing=((Math.round(angle)%360)+360)%360;
 if(Number($('heading').value)!==bearing)headingRevision++;
 $('heading').value=String(bearing);
 compass.style.setProperty('--angle',bearing+'deg');
 compass.setAttribute('aria-valuenow',bearing);
 compass.setAttribute('aria-valuetext',bearing+' 度');
 $('bearing').textContent=String(bearing).padStart(3,'0')+'°';
}
function pointCompass(event){
 if(compassFrozen)return;
 const box=compass.getBoundingClientRect();
 const x=event.clientX-box.left-box.width/2,y=event.clientY-box.top-box.height/2;
 if(Math.hypot(x,y)>6)setHeading(Math.atan2(x/box.width,-y/box.height)*180/Math.PI);
}
let compassDragging=false,compassFrozen=false;
compass.addEventListener('pointerdown',event=>{
 if(event.button!==0||compassFrozen)return;
 compass.setPointerCapture(event.pointerId);compassDragging=true;pointCompass(event);
});
compass.addEventListener('pointermove',event=>{
 if(compass.hasPointerCapture(event.pointerId))pointCompass(event);
});
compass.addEventListener('lostpointercapture',()=>{compassDragging=false;});
compass.addEventListener('keydown',event=>{
 if(compassFrozen){event.preventDefault();return;}
 const steps={ArrowUp:1,ArrowRight:1,ArrowDown:-1,ArrowLeft:-1,PageUp:15,PageDown:-15};
 const key=event.key;
